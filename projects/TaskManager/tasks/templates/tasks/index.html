<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task Manager</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f6f9;
      }
      h1 {
        color: #333;
      }
      form {
        margin-bottom: 20px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
      }
      input,
      select,
      button {
        margin: 5px 0;
        padding: 8px;
        width: 100%;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .task {
        padding: 10px;
        border: 1px solid #ccc;
        background: #fff;
        margin-bottom: 10px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Task Manager Frontend</h1>

    <!-- Login Form -->
    <form id="loginForm">
      <h3>Login</h3>
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <!-- Create Task Form -->
    <form id="createTaskForm" style="display: none">
      <h3>Create Task</h3>
      <input type="text" id="title" placeholder="Title" required />
      <input type="text" id="description" placeholder="Description" />
      <input type="date" id="due_date" />
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <input type="text" id="assignee" placeholder="Assignee username" />
      <button type="submit">Create Task</button>
    </form>

    <!-- Tasks Section -->
    <h3>My Tasks</h3>
    <div id="tasks"></div>

    <script>
      const API_BASE = "http://127.0.0.1:8000"; // change if needed
      let token = "";

      // Login
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          const response = await fetch(`${API_BASE}/api/token/`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();
          if (data.access) {
            token = data.access;
            alert("Login successful!");
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("createTaskForm").style.display = "block";
            fetchTasks();
          } else {
            alert("Login failed!");
          }
        });

      // Fetch tasks
      async function fetchTasks() {
        const res = await fetch(`${API_BASE}/mytasks/`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const tasks = await res.json();
        const tasksDiv = document.getElementById("tasks");
        tasksDiv.innerHTML = "";
        tasks.forEach((task) => {
          tasksDiv.innerHTML += `
          <div class="task">
            <strong>${task.title}</strong> (${task.priority}) - ${task.status}<br>
            Assigned to: ${task.assignee}<br>
            <button onclick="deleteTask(${task.id})">Delete</button>
          </div>`;
        });
      }

      // Create task
      document
        .getElementById("createTaskForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const task = {
            title: document.getElementById("title").value,
            description: document.getElementById("description").value,
            due_date: document.getElementById("due_date").value,
            priority: document.getElementById("priority").value,
            assignee: document.getElementById("assignee").value,
          };

          const res = await fetch(`${API_BASE}/createtask/`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(task),
          });

          if (res.ok) {
            alert("Task created!");
            fetchTasks();
          } else {
            alert("Error creating task!");
          }
        });

      // Delete task
      async function deleteTask(id) {
        const res = await fetch(`${API_BASE}/deletetask/?id=${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.ok) {
          alert("Task deleted!");
          fetchTasks();
        } else {
          alert("Error deleting task!");
        }
      }
    </script>
  </body>
</html>
